name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported and newest working. Not "3.x": dbus-next fails to
        # import on 3.15 (typing.no_type_check_decorator was removed).
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile $(find lowtide -name "*.py")
      - run: pip install -e ".[test]"
      - run: python -m pytest -q
