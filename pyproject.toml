[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "low-tide"
version = "0.3.0+local.security.1"
description = "A terminal UI client for TIDAL"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "tidalapi>=0.8.11",
    "textual>=8.2.3",
    "textual-image>=0.12.0,<0.13",
    "Pillow>=12.2.0",
    "dbus-next>=0.2.3",
    "defusedxml>=0.7.1",
    "mutagen>=1.47.0",
    "requests>=2.32.0",
    "rich>=14.0.0",
]

[project.optional-dependencies]
lastfm = ["pylast>=7.0.2"]

[project.scripts]
low-tide = "lowtide.main:main"

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "pip-audit>=2.9.0",
    "pytest>=8.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lowtide*"]
